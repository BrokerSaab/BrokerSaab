name: Deploy to Staging (Vercel)

on:
  push:
    branches: [develop]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  deploy:
    name: Frontend → Vercel Staging
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -sf -X POST "https://api.vercel.com/v1/integrations/deploy/prj_wb8juX3GZmJ0dBkJDdYwZbMr6KTs/6ybjsnMe1A"
          echo "Vercel deployment triggered successfully"
