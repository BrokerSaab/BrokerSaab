name: Deploy to Staging (Vercel)

on:
  push:
    branches: [develop]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  deploy:
    name: Frontend → Vercel Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p apps/frontend/.vercel
          echo '{"projectId":"prj_wb8juX3GZmJ0dBkJDdYwZbMr6KTs","orgId":"team_3PsO9fLuagTumWgO8BZhDAVy"}' > apps/frontend/.vercel/project.json

      - name: Deploy to Vercel
        working-directory: apps/frontend
        run: |
          url=$(vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes 2>&1 | tail -1)
          echo "Deployed to: $url"
