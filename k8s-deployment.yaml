apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokersaab-db
  labels:
    app: brokersaab-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brokersaab-db
  template:
    metadata:
      labels:
        app: brokersaab-db
    spec:
      containers:
      - name: db
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgrespassword123
        - name: POSTGRES_DB
          value: brokersaab
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  ports:
  - port: 5432
  selector:
    app: brokersaab-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokersaab-redis
  labels:
    app: brokersaab-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brokersaab-redis
  template:
    metadata:
      labels:
        app: brokersaab-redis
    spec:
      containers:
      - name: cache
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  ports:
  - port: 6379
  selector:
    app: brokersaab-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokersaab-api
  labels:
    app: brokersaab-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: brokersaab-api
  template:
    metadata:
      labels:
        app: brokersaab-api
    spec:
      containers:
      - name: api
        image: brokersaab-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgrespassword123@db-service:5432/brokersaab?schema=public"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  ports:
  - port: 5000
  selector:
    app: brokersaab-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokersaab-web
  labels:
    app: brokersaab-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brokersaab-web
  template:
    metadata:
      labels:
        app: brokersaab-web
    spec:
      containers:
      - name: web
        image: brokersaab-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  ports:
  - port: 3000
  selector:
    app: brokersaab-web
---
# Horizontal Pod Autoscaling (HPA) Policy
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: api-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brokersaab-api
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
